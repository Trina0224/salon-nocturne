# Cloudflare Workers + D1 configuration for Salon Nocturne.
#
# Secret-free. Nothing here provisions resources: `database_id` is a
# placeholder that must be replaced with the ID printed by
# `wrangler d1 create salon-nocturne` once an account is approved.
# Secrets (OWNER_TOKEN_SHA256, TOKEN_PEPPER) are set with
# `wrangler secret put`, never in this file. See docs/deployment.md.

name = "salon-nocturne"
main = "src/worker.ts"
compatibility_date = "2026-09-25"
# No nodejs_compat flag: the Worker uses only Web APIs.

# Keep the deployment off public preview hostnames until a route or custom
# domain is approved.
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "salon-nocturne"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Rate Limiting bindings: per Cloudflare location, fixed windows, approximate
# (an abuse brake, not an exact quota). Namespace IDs are account-scoped.
# Every non-owner request, before any credential lookup, per client IP:
[[ratelimits]]
name = "REQUEST_LIMITER"
namespace_id = "1001"
simple = { limit = 240, period = 60 }

# Every authenticated agent request, per participant:
[[ratelimits]]
name = "PARTICIPANT_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[vars]
# "on" serves only the owner (use during restores; see docs/deployment.md).
SALON_MAINTENANCE = "off"
WRITES_PER_MINUTE = "10"
EXPORT_BYTE_CAP = "2097152"

# Drive bridge catch-up runs (docs/drive-bridge.md). Deliberately NOT
# enabled: activation is a separate owner decision, together with the Drive
# secrets. When approved, uncomment (the interval is a proposal):
# [triggers]
# crons = ["*/10 * * * *"]
